name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop
        run: |
          npm run build -w @codep/codex-adapter
          npm run typecheck -w @codep/desktop
          node --import tsx --test apps/desktop/tests/artifacts.test.ts apps/desktop/tests/file-artifacts.test.ts

      - name: Build Windows package
        run: npm run package:desktop:win -- --x64

      - name: Generate package checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*_windows_x64.zip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($_.FullName + '.sha256') -Value "$hash  $($_.Name)" -Encoding ascii
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-windows-x64
          path: |
            release/*_windows_x64.zip
            release/*_windows_x64.zip.sha256
          if-no-files-found: error

      - name: Upload package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*_windows_x64.zip
            release/*_windows_x64.zip.sha256
